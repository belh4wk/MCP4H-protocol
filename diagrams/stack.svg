<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
<style>text{font-family:Inter,Arial,sans-serif;fill:#202124}.title{font-size:22px;font-weight:700}.box{stroke:#6b7280;stroke-width:1.4;rx:12}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#5f6368}</style>
<rect x="0" y="0" width="920" height="500" fill="#ffffff" stroke="#ddd"/>
<text x="460" y="38" text-anchor="middle" class="title">MCP4H Stack</text>
<rect x="110" y="70" width="700" height="65" fill="#eef5ff" class="box"/><text x="460" y="98" text-anchor="middle" class="label">Sources + Observation records</text><text x="460" y="119" text-anchor="middle" class="small">telemetry / software events / sensors / input systems</text>
<rect x="110" y="155" width="700" height="78" fill="#f3f8f1" class="box"/><text x="460" y="184" text-anchor="middle" class="label">Interpretation records + domain profiles</text><text x="460" y="206" text-anchor="middle" class="small">meaning, state, layer-scoped confidence, provenance, temporal/spatial/relational structure</text>
<rect x="110" y="253" width="700" height="78" fill="#f8f2ff" class="box"/><text x="460" y="282" text-anchor="middle" class="label">Optional Policy + Projection</text><text x="460" y="304" text-anchor="middle" class="small">attention behavior + mapping toward declared receiver capabilities</text>
<rect x="110" y="351" width="700" height="78" fill="#fff7ed" class="box"/><text x="460" y="380" text-anchor="middle" class="label">Transport / Renderer / Receiver</text><text x="460" y="402" text-anchor="middle" class="small">open-ended carriers, devices, people, software and future extensions</text>
<text x="460" y="464" text-anchor="middle" class="small">Preserve meaning. Adapt the carrier.</text>
</svg>
