<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>text{font-family:Inter,Arial,sans-serif;fill:#202124}.title{font-size:24px;font-weight:700}.box{fill:#f8f9fa;stroke:#5f6368;stroke-width:1.5}.sem{fill:#eef5ff}.decision{fill:#f5f0ff}.delivery{fill:#f4fff5}.receiver{fill:#fff8ed}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#5f6368}.arrow{stroke:#5f6368;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/></marker></defs>
<text x="600" y="42" text-anchor="middle" class="title">MCP4H v0.2 Conceptual Flow</text>
<rect x="40" y="90" width="190" height="64" rx="12" class="box"/><text x="135" y="118" text-anchor="middle" class="label">Sources</text><text x="135" y="140" text-anchor="middle" class="small">telemetry / software / sensors</text>
<rect x="285" y="90" width="190" height="64" rx="12" class="box sem"/><text x="380" y="118" text-anchor="middle" class="label">Observation record(s)</text><text x="380" y="140" text-anchor="middle" class="small">what was observed</text>
<rect x="530" y="90" width="190" height="64" rx="12" class="box sem"/><text x="625" y="118" text-anchor="middle" class="label">Interpretation record(s)</text><text x="625" y="140" text-anchor="middle" class="small">what it appears to mean</text>
<rect x="775" y="58" width="175" height="58" rx="12" class="box decision"/><text x="862" y="92" text-anchor="middle" class="label">Optional Policy</text>
<rect x="775" y="142" width="175" height="58" rx="12" class="box decision"/><text x="862" y="176" text-anchor="middle" class="label">Projection</text>
<rect x="775" y="235" width="175" height="58" rx="12" class="box"/><text x="862" y="258" text-anchor="middle" class="label">Capability Profile</text><text x="862" y="278" text-anchor="middle" class="small">receiver / renderer path</text>
<rect x="1005" y="90" width="155" height="64" rx="12" class="box delivery"/><text x="1082" y="118" text-anchor="middle" class="label">Transport / Renderer</text><text x="1082" y="140" text-anchor="middle" class="small">adapt + express</text>
<rect x="1005" y="260" width="155" height="64" rx="12" class="box receiver"/><text x="1082" y="288" text-anchor="middle" class="label">Receiver</text><text x="1082" y="310" text-anchor="middle" class="small">person / system / device</text>
<rect x="775" y="370" width="175" height="58" rx="12" class="box"/><text x="862" y="404" text-anchor="middle" class="label">Optional Response</text>
<path d="M230 122 H285" class="arrow"/><path d="M475 122 H530" class="arrow"/><path d="M720 100 H775" class="arrow"/><path d="M720 142 H775" class="arrow"/><path d="M862 116 V142" class="arrow"/><path d="M862 235 V200" class="arrow"/><path d="M950 171 H1005" class="arrow"/><path d="M1082 154 V260" class="arrow"/><path d="M1082 324 C1082 398 990 399 950 399" class="arrow"/><path d="M775 399 C560 520 330 500 330 154" class="arrow"/>
<text x="600" y="610" text-anchor="middle" class="small">Records are independently addressable and linked by IDs/relations. Low-latency transports may bundle records without collapsing their logical roles.</text>
</svg>
